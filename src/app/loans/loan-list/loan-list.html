<div class="text-center">
  <h1 class="font-extrabold">Loans Details</h1>
  <div>
    <input
      type="text"
      placeholder="Search loan"
      [value]="searchText()"
      (input)="searchText.set($any($event.target).value)"
    />
  </div>
  <select class="border-2">
    <option value="" disabled selected>Select a loan</option>
    @for (loan of filteredLoans(); track loan.id) {
      <option [value]="loan.id">{{ loan.email }} - {{ loan.postId }}</option>
    }
  </select>
</div>
@if (loading()) {
  <p>Loading loans...</p>
}
@if (error()) {
  <p>{{ error() }}</p>
}
@if (!loading() && loans().length === 0) {
  <p>No loans found.</p>
}

<div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 p-4">
  @for (loan of loans(); track loan.id) {
    <div
      class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm transition-shadow hover:shadow-md"
    >
      <h2 class="mb-3 text-xl font-semibold text-gray-800">
        {{ loan.name }}
      </h2>
      <h2 class="mb-3 text-xl font-semibold text-green-800">
        {{ loan.email }}
      </h2>
      <span class="font-medium text-gray-800"> ${{ loan.body }} </span>
    </div>
  }
</div>
