<main class="main">
  <div class="content">
    <div class="left-side">
      <h1>Hello, {{ title() }}</h1>
      <p>Congratulations! Your app is running. 🎉</p>
    </div>

    <h2>Count: {{ count() }}</h2>

    <button (click)="decrement()" class="bg-red-200 px-2 mx-2 rounded-2xl text-white">Decrement</button>
    <button (click)="increment()" class="bg-green-700 px-2  mx-2 rounded-2xl text-white">Increment</button>

    <button (click)="reset()" class="bg-orange-700 px-2  mx-2 rounded-2xl text-white">Reset</button>
  </div>
</main>
